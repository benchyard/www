# Product console plane. Images only — no host source tree, no `build:`.
name: benchyard

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16@sha256:11a9d238fbb48bab14599c57e41123254452b1a2d93c6c8595bce96f346bd082}
    environment:
      POSTGRES_USER: benchyard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: benchyard
    volumes:
      - benchyard-pg:/var/lib/postgresql/data
    networks:
      - benchyard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchyard -d benchyard"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-benchyard}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - benchyard-minio:/data
    networks:
      - benchyard
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    image: ${BENCHYARD_API_IMAGE:?set BENCHYARD_API_IMAGE to a release digest}
    ports:
      - "${API_PORT:-8004}:8004"
    environment:
      DEV_MODE: "false"
      HOST: "0.0.0.0"
      PORT: "8004"
      WORKERS: "1"
      LOG_LEVEL: info
      DATABASE_URL: postgresql+asyncpg://benchyard:${POSTGRES_PASSWORD}@postgres:5432/benchyard
      BENCHYARD_SECRET_MASTER_KEY: ${BENCHYARD_SECRET_MASTER_KEY:?set BENCHYARD_SECRET_MASTER_KEY}
      BENCHYARD_SECRET_MASTER_KEYS: ${BENCHYARD_SECRET_MASTER_KEYS:-}
      BENCHYARD_SECRET_ACTIVE_KEY_ID: ${BENCHYARD_SECRET_ACTIVE_KEY_ID:-k1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3011}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3011}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/benchyard}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-benchyard}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-benchyard}
      S3_REGION: ${S3_REGION:-us-east-1}
      BENCHYARD_VERSION: ${BENCHYARD_VERSION:-}
      BENCHYARD_API_IMAGE: ${BENCHYARD_API_IMAGE}
      BENCHYARD_WEB_IMAGE: ${BENCHYARD_WEB_IMAGE}
      BENCHYARD_UPDATER_URL: http://updater:8787
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - benchyard
    restart: unless-stopped

  web:
    image: ${BENCHYARD_WEB_IMAGE:?set BENCHYARD_WEB_IMAGE to a release digest}
    ports:
      - "${WEB_PORT:-3011}:3011"
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3011"
      BENCHYARD_API_INTERNAL_URL: http://api:8004
    depends_on:
      api:
        condition: service_healthy
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    networks:
      - benchyard
    restart: unless-stopped

  scheduler:
    image: ${BENCHYARD_API_IMAGE:?set BENCHYARD_API_IMAGE to a release digest}
    command: ["python", "-m", "benchyard.entrypoints.scheduler"]
    environment:
      LOG_LEVEL: info
      DATABASE_URL: postgresql+asyncpg://benchyard:${POSTGRES_PASSWORD}@postgres:5432/benchyard
      BENCHYARD_SECRET_MASTER_KEY: ${BENCHYARD_SECRET_MASTER_KEY:?set BENCHYARD_SECRET_MASTER_KEY}
      BENCHYARD_SECRET_MASTER_KEYS: ${BENCHYARD_SECRET_MASTER_KEYS:-}
      BENCHYARD_SECRET_ACTIVE_KEY_ID: ${BENCHYARD_SECRET_ACTIVE_KEY_ID:-k1}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-benchyard}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-benchyard}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    networks:
      - benchyard
    restart: unless-stopped

  migrate:
    image: ${BENCHYARD_API_IMAGE:?set BENCHYARD_API_IMAGE to a release digest}
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://benchyard:${POSTGRES_PASSWORD}@postgres:5432/benchyard
      BENCHYARD_SECRET_MASTER_KEY: ${BENCHYARD_SECRET_MASTER_KEY:?set BENCHYARD_SECRET_MASTER_KEY}
      BENCHYARD_SECRET_MASTER_KEYS: ${BENCHYARD_SECRET_MASTER_KEYS:-}
      BENCHYARD_SECRET_ACTIVE_KEY_ID: ${BENCHYARD_SECRET_ACTIVE_KEY_ID:-k1}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-benchyard}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-benchyard}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    networks:
      - benchyard
    restart: "no"

  updater:
    image: python:3.14.7-slim-trixie@sha256:ce40764625a4ff50df3548277632e7f96c4e77fe75fa848aae9885476e7df5a4
    command: ["python3", "/opt/benchyard/updater/server.py"]
    environment:
      BENCHYARD_UPDATER_ROLE: console
      BENCHYARD_COMPOSE_DIR: /opt/benchyard/console
      BENCHYARD_REGISTRY_ENV: /opt/benchyard/registry.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/benchyard:/opt/benchyard
      - /usr/bin/docker:/usr/bin/docker:ro
      - /usr/libexec/docker:/usr/libexec/docker:ro
      - /usr/local/bin/cosign:/usr/local/bin/cosign:ro
    networks:
      - benchyard
    restart: unless-stopped

volumes:
  benchyard-pg:
    name: benchyard-pg
  benchyard-minio:
    name: benchyard-minio

networks:
  benchyard:
    name: benchyard
